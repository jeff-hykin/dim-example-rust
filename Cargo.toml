[package]
name = "dim-example-rust"
version = "0.1.0"
edition = "2021"
# nixos-25.05's rustc: Cargo.lock is resolved to versions it builds (CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo update)
rust-version = "1.86"
license = "Apache-2.0"
description = "A dimOS Desktop example app with a Rust server"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

# the server lives in server/: Desktop's `app check` reads backend/, server/ and src-server/ as the app's own server,
# so its route paths ("/api/hello") aren't mistaken for calls to Desktop's API
[[bin]]
name = "dim-example-rust"
path = "server/main.rs"
