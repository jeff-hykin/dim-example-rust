# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: Example (Rust)
spec-version: v1.0
uses:
    "@dimos-gateway":
        - GET /runs
        - GET /msgs.js
    "@desktop-gateway":
        - POST /api/notifications
    "@zenoh-gateway": ">=0.5 <0.6"
    dim-controller:
        - GET api/status
provides:
    description: "Example (Rust): a showcase dimOS app; it keeps a list of notes"
    endpoints:
        - method: GET
          path: api/hello
          description: Who this app is, what dimos is running right now, and how many notes it holds
          role: context
        - method: POST
          path: api/notes
          description: Add a note to the app's list (the person gets a notification)
          params:
              text:
                  type: string
                  description: the note
    private:
        - api/internal/*
