# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: Example (Rust)
spec-version: v1.2
uses:
    "@dimos-gateway":
        - GET /runs
        - GET /msgs.js
        - GET /runs/skills
        - POST /runs
    "@desktop-gateway":
        - POST /api/notifications
    "@zenoh-gateway": ">=0.5 <0.6"
    dim-controller:
        - GET api/status
# spec v1.2: what the page may do on zenoh, as zenoh's ACL config (the topic boxes take any topic of these types)
zenoh:
    default_permission: deny
    read:
        - id: odom-and-camera
          messages: [declare_subscriber, put] # subscribe, and receive its samples
          key_exprs: ["dimos/**/geometry_msgs.PoseStamped", "dimos/**/sensor_msgs.Image"]
          permission: allow
    write:
        - id: drive
          messages: [put] # the cmd_vel publisher (and its deadman)
          key_exprs: ["dimos/**/geometry_msgs.Twist"]
          permission: allow
provides:
    when: you want to see what dimos runs, or leave the person a note, via the Rust example
    description: "Example (Rust): a showcase dimOS app; it keeps a list of notes"
    endpoints:
        - method: GET
          path: api/hello
          when: you need to know what dimos runs now, or how many notes the Rust example holds
          description: >-
              Who this app is and what dimos is running. Takes nothing; answers JSON: shape ("Rust"), app (its name),
              unixTime (now, in seconds), running ("<blueprint> (<phase>)" of the dimos gateway's current launch, or
              null when nothing runs) and notes (how many notes it holds)
          role: context
        - method: POST
          path: api/notes
          when: you want to leave the person a note in the Rust example app
          description: >-
              Add a note to the end of the app's list (kept in its data folder) and show the person a Desktop
              notification ("A note from the agent") with it. Body: JSON {"text": "..."}. Answers {"notes": [...]},
              the whole list after it; an empty text gets 400 {"error": ...}
          params:
              text:
                  type: string
                  description: the note's text (trimmed; must not be empty)
    private:
        - api/internal/*
