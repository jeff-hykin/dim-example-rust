<!doctype html>
<!--
  A dimOS Desktop app page. Desktop serves it at /apps/<name>/ (from the Rust server, server/main.rs), so every URL below is RELATIVE:
    ../../gateways/dimos/...    the dimos gateway's API                        -> /gateways/dimos/...
    ../../gateways/desktop/...  Desktop's own API                              -> /gateways/desktop/...
    ../../apps/<other>/         another app's public (provides:) endpoints     -> /apps/<other>/...
    api/...                     this app's own server (the Deno/Rust examples) -> /apps/<name>/api/...
  Every one of them is declared in dimos.yaml; Desktop refuses an undeclared call from this page (a 403 + a notification).
  So is everything it does on zenoh (dimos.yaml `zenoh:`, spec v1.2): the subscriptions and the cmd_vel publisher below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>dimOS example app</title>
        <!-- No build: the libraries come from esm.sh by URL (pinned tags), and React is shared through this import map. -->
        <script type="importmap">
            {
                "imports": {
                    "react": "https://esm.sh/react@19.2.0",
                    "react/": "https://esm.sh/react@19.2.0/",
                    "react-dom": "https://esm.sh/react-dom@19.2.0",
                    "react-dom/": "https://esm.sh/react-dom@19.2.0/",
                    "dimos-react": "https://esm.sh/gh/jeff-hykin/dimos-react@v0.3.2/src/index.ts?external=react,react-dom,three"
                }
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="app.js"></script>
    </body>
</html>
