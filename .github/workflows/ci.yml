name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # what Desktop runs on install
      - run: nix build .#dimosApp --print-build-logs
      # Cargo.toml's version is the app's own version, and the build can't check it (it never reads dimos.yaml)
      - run: ./scripts/check_version.sh
